name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Slate.slnx -c Release

      - name: Unit tests
        run: dotnet test tests/Slate.Core.Tests/Slate.Core.Tests.csproj -c Release --no-build

      # Exercises Win32 calls against the runner's desktop session.
      - name: Integration tests
        run: dotnet test tests/Slate.App.IntegrationTests/Slate.App.IntegrationTests.csproj -c Release --no-build
